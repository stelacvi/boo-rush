<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Boo Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Nunito:wght@500;700;900&display=swap">
<style>
/* Layout: one haunted stage card, a live leaderboard beside it (below on phones). Single dark world by design. */
:root{
  --night:#150e2c; --dusk:#24184a; --plum:#3a2a6e; --lilac:#b6a0f2;
  --ghost:#fbf8ff; --ink:#1c1230; --candy:#ffb3c9; --mint:#7ef0c1; --boo:#ff7a8a;
  --muted:#a597cf;
  --display:"Sniglet","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--plum),var(--night) 70%) fixed,var(--night);color:var(--ghost);font:500 16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:680px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--candy);outline-offset:3px}

/* stage */
.stage{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:2px solid rgba(182,160,242,.18);border-radius:28px;padding:22px clamp(16px,3vw,32px) 26px;min-height:620px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.hud{display:flex;align-items:center;gap:12px;font-weight:900;font-variant-numeric:tabular-nums}
.hud .round{font-family:var(--body);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac)}
.hud .score{margin-left:auto;font-size:22px}
.hud .streak{font-size:14px;color:var(--candy);min-width:70px;text-align:right}
.timer{height:10px;border-radius:99px;background:rgba(255,255,255,.08);margin:12px 0 6px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--candy),var(--lilac));border-radius:99px;transform-origin:left}
.timer.low i{background:var(--boo)}
.prompt{font-family:var(--display);font-size:clamp(22px,3.4vw,30px);text-align:center;margin:10px 0 4px}
.prompt b{color:var(--candy);font-family:var(--body);font-weight:900}

.ghostbox{position:relative;width:min(340px,82%);margin:0 auto;aspect-ratio:340/330}
.ghostbox svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
.reveal{position:absolute;inset:6% 12%;border-radius:50%;overflow:hidden;border:6px solid var(--ghost);opacity:0;transform:scale(.85);transition:opacity .25s,transform .25s;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.reveal img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.show-reveal .reveal{opacity:1;transform:scale(1)}
.show-reveal svg{opacity:0;transition:opacity .2s}
.lid{transition:opacity .35s}
.lights-out .lid{opacity:.95}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto;padding-top:14px}
.ans{background:var(--ghost);color:var(--ink);border:0;border-radius:18px;padding:14px 12px;font-weight:900;font-size:17px;box-shadow:0 5px 0 #8a6cc9;transition:transform .08s,box-shadow .08s,background .2s;min-height:60px}
.ans:hover{transform:translateY(-2px)}
.ans:active{transform:translateY(3px);box-shadow:0 2px 0 #8a6cc9}
.ans.right{background:var(--mint)}
.ans.wrong{background:var(--boo);color:var(--ghost)}
.ans:disabled{cursor:default}

.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.tile{background:rgba(255,255,255,.04);border:2px solid rgba(182,160,242,.2);border-radius:20px;padding:8px 6px 18px;aspect-ratio:1/1;overflow:hidden;position:relative;transition:transform .1s,border-color .2s,background .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--lilac)}
.tile svg{width:100%;height:100%;display:block;overflow:visible}
.tile.right{background:rgba(126,240,193,.25);border-color:var(--mint)}
.tile.wrong{background:rgba(255,122,138,.25);border-color:var(--boo)}
.tile .who{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--ink);color:var(--ghost);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:900;white-space:nowrap;opacity:0;transition:opacity .2s}
.tile.named .who{opacity:1}
@media (max-width:480px){.grid6{gap:8px}.answers{gap:8px}.ans{font-size:15px;padding:12px 8px}}

.pop{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:40px;pointer-events:none;opacity:0}
.pop.go{animation:pop .8s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* intro / end screens */
.screen{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin:auto 0;padding:10px 0}
.screen h1{font-size:clamp(48px,8vw,76px);line-height:.95;letter-spacing:-.01em}
.screen h1 span{color:var(--candy)}
.screen p{margin:0;max-width:44ch;color:var(--muted)}
.rounds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:560px;margin:6px 0}
.rounds div{background:rgba(255,255,255,.05);border-radius:18px;padding:12px 10px;text-align:left;min-width:0}
.rounds b{display:block;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.01em;color:var(--ghost)}
.eyebrow{color:var(--lilac)!important;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.roundtitle{font-size:44px;font-weight:400}
.rules{list-style:none;margin:4px 0 8px;padding:0;display:flex;flex-direction:column;gap:10px;max-width:440px;text-align:left}
.rules li{background:rgba(255,255,255,.05);border-radius:14px;padding:10px 14px 10px 40px;position:relative;color:var(--ghost)}
.rules li::before{content:"👻";position:absolute;left:12px;top:9px;font-size:16px}
.rules b{color:var(--candy)}
.rounds small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.rounds em{font-style:normal;font-weight:900;color:var(--candy);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:560px){.rounds{grid-template-columns:1fr}}
.big{background:var(--candy);color:var(--ink);border:0;border-radius:99px;padding:16px 40px;font-family:var(--display);font-weight:800;font-size:22px;box-shadow:0 6px 0 #c76f8f;transition:transform .08s}
.big:hover{transform:translateY(-2px)}
.ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.nameform{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:360px}
.nameform input{width:100%;padding:14px 18px;border-radius:16px;border:2px solid var(--lilac);background:rgba(255,255,255,.06);color:var(--ghost);font:900 20px var(--body);text-align:center}
.nameform input::placeholder{color:var(--muted)}
.nameform input:focus{outline:3px solid var(--candy);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ghostly{background:transparent;color:var(--ghost);border:2px solid var(--lilac);border-radius:99px;padding:13px 26px;font-weight:900;font-size:17px}
.ghostly:hover{background:rgba(182,160,242,.15)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c76f8f}
.count{font-family:var(--display);font-size:120px;line-height:1;color:var(--candy)}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stats div{background:rgba(255,255,255,.06);border-radius:16px;padding:10px 16px;min-width:110px}
.stats b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:13px}
.note{font-size:14px;color:var(--muted)}

/* leaderboard */
.board{background:rgba(21,14,44,.6);border:2px solid rgba(182,160,242,.18);border-radius:24px;padding:18px 16px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.board h2{font-size:22px;display:flex;align-items:baseline;gap:8px}
.board h2 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700;margin-left:auto}
.board ol{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto}
.board li{display:grid;grid-template-columns:26px 30px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 8px;border-radius:14px;font-variant-numeric:tabular-nums}
.board li.me{background:rgba(255,179,201,.14)}
.board .rk{font-weight:900;color:var(--muted);text-align:center}
.board li:nth-child(1) .rk{color:#ffd76a}.board li:nth-child(2) .rk{color:#e3e3ef}.board li:nth-child(3) .rk{color:#f0a76a}
.board img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--plum)}
.board .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .nm small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.board .pt{font-weight:900;font-size:18px}
.board .empty{color:var(--muted);font-size:14px;margin:12px 0 0}
@media (prefers-reduced-motion:reduce){.float,.pop.go,.shake{animation:none}.reveal,.timer i{transition:none}}
</style>
</head>
<body>

<script>
const PEOPLE = [{"n":"Neven Matas","f":"photos/00b.png","W":438,"H":526,"e":[24.0,50.4,52.1,42.8],"g":"m"},{"n":"Vanja Bobotić","f":"photos/01b.png","W":496,"H":642,"e":[27.2,35.8,60.1,38.6],"g":"m"},{"n":"Tihana Vukšić","f":"photos/02b.png","W":356,"H":430,"e":[30.9,47.0,61.8,46.0],"g":"f"},{"n":"Lana Ljevaković","f":"photos/03b.png","W":508,"H":584,"e":[29.9,37.7,58.1,41.4],"g":"f"},{"n":"Mislav Opašić","f":"photos/04b.png","W":224,"H":304,"e":[31.3,43.2,64.7,38.2],"g":"m"},{"n":"Matija Đurđek","f":"photos/05.jpg","W":400,"H":400,"e":[38.9,26.5,50.5,26.5],"g":"m"},{"n":"Stela Cvijanović","f":"photos/06.jpg","W":400,"H":400,"e":[43.6,36.8,60.3,38.5],"g":"f"},{"n":"Dino Fazlić","f":"photos/07.jpg","W":400,"H":400,"e":[46.7,32.7,58.3,33.8],"g":"m"},{"n":"Nebojša Žigić","f":"photos/08b.png","W":632,"H":628,"e":[21.4,51.0,49.8,42.2],"g":"m"},{"n":"Sara Nejašmić","f":"photos/09.jpg","W":400,"H":400,"e":[44.5,33.3,57,33.3],"g":"f"},{"n":"Luka Pavić","f":"photos/10.jpg","W":400,"H":400,"e":[40.4,44,59.2,43.5],"g":"m"},{"n":"Filip Ambruš","f":"photos/11b.png","W":286,"H":372,"e":[30.3,38.4,61.8,35.7],"g":"m"},{"n":"Hrvoje Podhraški","f":"photos/12.jpg","W":400,"H":400,"e":[39.3,45,54.9,44.5],"g":"m"},{"n":"Endrina Eskić","f":"photos/13.jpg","W":400,"H":400,"e":[50.5,51.5,65.2,51],"g":"f"},{"n":"Andrej Ivanović","f":"photos/14.jpg","W":400,"H":400,"e":[52.3,36,67.4,34.5],"g":"m"},{"n":"Dino Vinković","f":"photos/15.jpg","W":256,"H":256,"e":[42.4,51.6,60,51.6],"g":"m"},{"n":"Ivan Čižmak","f":"photos/16.jpg","W":400,"H":400,"e":[46.2,48,56.6,43.5],"g":"m"},{"n":"Antonela Petek Marković","f":"photos/17.jpg","W":400,"H":400,"e":[25.9,30.1,38.9,30.1],"g":"f"},{"n":"Maja Matanović","f":"photos/18.jpg","W":400,"H":400,"e":[39.3,21.9,62.2,18.7],"g":"f"},{"n":"Palma Pisačić","f":"photos/19.jpg","W":400,"H":400,"e":[45.4,23.7,58.7,22.2],"g":"f"},{"n":"Andrea Nucak","f":"photos/20b.png","W":470,"H":546,"e":[27.7,39.9,57.9,44.0],"g":"f"},{"n":"Mija Vandek","f":"photos/21.jpg","W":400,"H":400,"e":[37.1,30.5,52.7,30.5],"g":"f"},{"n":"Filip Jovanović","f":"photos/22.jpg","W":400,"H":400,"e":[46.2,21.5,58.3,21.5],"g":"m"},{"n":"Uranela Pavlovska","f":"photos/23.jpg","W":400,"H":400,"e":[30.7,36.1,58.3,37],"g":"f"},{"n":"Zhivorad Trajanovski","f":"photos/24.jpg","W":400,"H":400,"e":[39.3,51.2,65.7,49.5],"g":"m"},{"n":"Laura Glück-Radičević","f":"photos/25b.png","W":160,"H":218,"e":[26.6,35.0,45.3,35.0],"g":"f"},{"n":"Anamaria Androlić","f":"photos/26.jpg","W":400,"H":400,"e":[44.1,30.1,66.3,28.4],"g":"f"},{"n":"Tihana Brnardić","f":"photos/27.jpg","W":400,"H":400,"e":[41,39.4,57.7,39.4],"g":"f"},{"n":"Dino Nikodinovski","f":"photos/28.jpg","W":400,"H":400,"e":[42.5,37.6,57.7,37.6],"g":"m"},{"n":"Teodor Petrovski","f":"photos/29.jpg","W":400,"H":400,"e":[45.4,18.9,58.3,18.9],"g":"m"},{"n":"Kristina Zlatevska","f":"photos/30.png","W":400,"H":400,"e":[47.3,23.3,55.7,22.2],"g":"f"},{"n":"Valentina Biber","f":"photos/31.png","W":400,"H":400,"e":[49,30.5,59.8,26.2],"g":"f"},{"n":"Strahinja Raičević","f":"photos/32b.png","W":208,"H":292,"e":[33.4,52.4,69.7,47.8],"g":"m"},{"n":"Anja Stamatović","f":"photos/33.png","W":400,"H":400,"e":[45.4,21.5,55.5,21],"g":"f"},{"n":"Karlo Ujdenica","f":"photos/34.jpg","W":400,"H":400,"e":[45.4,25.4,53.3,25.4],"g":"m"},{"n":"Petra Benjak","f":"photos/35.jpg","W":400,"H":400,"e":[50,36.7,59.3,39],"g":"f"}];
const ROUNDS = [
  {key:'who',  title:'Who’s that Boo?', secs:60, pts:100, blurb:'Name the eyes.',
   rules:['A ghost appears with four names.','Pick the person whose eyes you see.','Each correct answer is worth <b>100 points</b>.']},
  {key:'find', title:'Find the Boo',    secs:60, pts:100, blurb:'Find the named ghost.',
   rules:['You get a name and six ghosts.','Tap the ghost with that person’s eyes.','Each correct answer is worth <b>100 points</b>.']},
  {key:'zoom', title:'Zoom Out',        secs:45, pts:300, blurb:'Answer before the points run out.',
   rules:['The eyes start very close and slowly zoom out.','Points start at <b>300</b> and keep dropping until they hit <b>zero</b>.','The faster you answer, the more you get.']}
];
const STREAK_AT = 3, STREAK_BONUS = 50;
const LINE='#1c1230', BODY='#fbf8ff', SHADE='#dcd0f2', SHADOW='#8a6cc9';
const BODY_PATH='M118 205 C112 120 160 72 210 72 C268 72 300 120 304 190 L310 300 C314 335 328 352 346 368 C330 386 306 384 292 370 C282 392 256 398 238 382 C222 402 192 402 178 384 C160 398 134 392 126 364 C118 330 118 290 118 250 Z';
const ARM_L='M124 218 C100 200 76 196 70 214 C64 236 90 262 122 272';
const ARM_R='M300 214 C324 190 350 188 356 206 C362 228 336 254 306 266';
const GL=[166,197], GR=[254,197], ER=34, BASE=76, ZOOM=1.43, ZSTART=3.95, ZDUR=5000, PDUR=10000;
let uid=0;

function plainGhostSVG(){
  return ghostSVG(null);
}
function ghostSVG(p,tight,zoom=ZOOM){
  const k=++uid;
  if(!p) p={W:1,H:1,e:[0,0,100,0],f:''};
  const W=p.W, H=p.H, e=p.e, plain=!p.f;
  const l=[e[0]*W/100,e[1]*H/100], r=[e[2]*W/100,e[3]*H/100];
  const d=Math.hypot(r[0]-l[0],r[1]-l[1]), s=BASE/d, a=Math.atan2(r[1]-l[1],r[0]-l[0])*180/Math.PI;
  const photoEyes=()=>`${[[GL,l,'el'],[GR,r,'er']].map(([g,c,id])=>`<g clip-path="url(#${id}${k})"><rect x="${g[0]-ER}" y="${g[1]-ER}" width="${2*ER}" height="${2*ER}" fill="#2b2140"/><image class="eyeimg" data-pre="translate(${g[0]} ${g[1]}) rotate(${-a})" data-s="${s}" data-post="translate(${-c[0]} ${-c[1]})" href="${p.f}" width="${W}" height="${H}" transform="translate(${g[0]} ${g[1]}) rotate(${-a}) scale(${s*zoom}) translate(${-c[0]} ${-c[1]})"/></g>`).join('')}
  <g class="lid" opacity="0" fill="${LINE}"><circle cx="${GL[0]}" cy="${GL[1]}" r="${ER}"/><circle cx="${GR[0]}" cy="${GR[1]}" r="${ER}"/></g>
  <circle cx="${GL[0]}" cy="${GL[1]}" r="${ER}" fill="none" stroke="${LINE}" stroke-width="7"/><circle cx="${GR[0]}" cy="${GR[1]}" r="${ER}" fill="none" stroke="${LINE}" stroke-width="7"/>`;
  return `<svg viewBox="${tight?'78 70 280 250':'40 50 340 370'}" aria-hidden="true">
  <defs><clipPath id="b${k}"><path d="${BODY_PATH}"/></clipPath>
  <clipPath id="el${k}"><circle cx="${GL[0]}" cy="${GL[1]}" r="${ER}"/></clipPath><clipPath id="er${k}"><circle cx="${GR[0]}" cy="${GR[1]}" r="${ER}"/></clipPath></defs>
  <g transform="translate(12 12)" fill="${SHADOW}" opacity=".55"><path d="${BODY_PATH}"/><path d="${ARM_L}Z"/><path d="${ARM_R}Z"/></g>
  <g fill="${BODY}" stroke="${LINE}" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"><path d="${ARM_L}"/><path d="${ARM_R}"/></g>
  <path d="${BODY_PATH}" fill="${BODY}"/>
  <g clip-path="url(#b${k})" fill="${SHADE}"><path d="M282 150 C300 190 300 290 312 330 C320 360 340 370 360 380 L360 60 Z"/><ellipse cx="170" cy="345" rx="24" ry="60" transform="rotate(-12 170 345)"/><ellipse cx="236" cy="350" rx="20" ry="55" transform="rotate(-14 236 350)"/></g>
  <path d="${BODY_PATH}" fill="none" stroke="${LINE}" stroke-width="8" stroke-linejoin="round"/>
  ${plain ? `<g fill="${LINE}"><circle cx="${GL[0]}" cy="${GL[1]}" r="22"/><circle cx="${GR[0]}" cy="${GR[1]}" r="22"/></g><g fill="#fff"><circle cx="${GL[0]-7}" cy="${GL[1]-8}" r="6"/><circle cx="${GR[0]-7}" cy="${GR[1]-8}" r="6"/></g>` : photoEyes()}
  </svg>`;
}

const $ = s => document.querySelector(s);
const stage = $('#stage');
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const firstName = n => n.split(' ')[0];

/* ---------- game state ---------- */
let G = null;

function home(){
  G = null;
  stage.innerHTML = `<div class="screen">
    <div class="ghostbox float" style="width:min(220px,60%)">${plainGhostSVG()}</div>
    <h1>Boo <span>Rush</span></h1>
    <p>36 QA ghosts, only their eyes to go on. Three quick rounds.</p>
    <div class="rounds">${ROUNDS.map((r,i)=>`<div><em>Round ${i+1} · ${r.secs}s</em><b>${r.title}</b><small>${r.blurb}</small></div>`).join('')}</div>
    <button class="big" id="start">Start haunting</button>
  </div>`;
  $('#start').onclick = () => start('');
}

async function start(name){
  G = {name, score:0, streak:0, best:0, correct:0, answered:0, deck:shuffle(PEOPLE), di:0};
  for (let i=0;i<ROUNDS.length;i++){
    await intro(i);
    await playRound(i);
  }
  finish();
}

function draw(){ if(G.di>=G.deck.length){G.deck=shuffle(PEOPLE);G.di=0} return G.deck[G.di++]; }

function intro(i){
  const r = ROUNDS[i];
  return new Promise(resolve=>{
    stage.innerHTML = `<div class="screen">
      <p class="eyebrow">Round ${i+1} of 3 · ${r.secs} seconds</p>
      <h2 class="roundtitle">${r.title}</h2>
      <ul class="rules">${r.rules.map(x=>`<li>${x}</li>`).join('')}<li>Three right in a row starts a streak: <b>+50</b> on every correct answer after that.</li></ul>
      <button class="big" id="go">Play</button>
    </div>`;
    const go=$('#go'); go.focus(); go.onclick=()=>resolve();
  });
}

function hud(i){
  return `<div class="hud"><span class="round">Round ${i+1} · ${ROUNDS[i].title}</span><span class="streak" id="streak"></span><span class="score" id="score">${G.score}</span></div>
  <div class="timer" id="timer"><i id="bar"></i></div>`;
}
function paintHud(){
  $('#score').textContent = G.score;
  $('#streak').textContent = G.streak>=STREAK_AT ? `🔥 ${G.streak} streak` : '';
}
function popText(txt,color){
  const p=document.createElement('div'); p.className='pop go'; p.textContent=txt; p.style.color=color; stage.appendChild(p); setTimeout(()=>p.remove(),850);
}
function scoreHit(base){
  G.correct++; G.answered++; G.streak++; G.best=Math.max(G.best,G.streak);
  const gain = base + (G.streak>=STREAK_AT ? STREAK_BONUS : 0);
  G.score += gain; paintHud(); popText('+'+gain,'var(--mint)');
}
function scoreMiss(){
  G.answered++; G.streak=0; paintHud(); popText('Boo!','var(--boo)');
  stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
}

function playRound(i){
  return new Promise(resolve=>{
    const r = ROUNDS[i], end = performance.now() + r.secs*1000;
    let done=false;
    stage.innerHTML = hud(i) + `<div id="play" style="display:flex;flex-direction:column;flex:1"></div>`;
    paintHud();
    const bar=$('#bar'), timer=$('#timer');
    (function tick(){
      if(done) return;
      const left = Math.max(0,end-performance.now());
      bar.style.transform=`scaleX(${left/(r.secs*1000)})`;
      timer.classList.toggle('low', left<10000);
      if(left<=0){ done=true; resolve(); return; }
      requestAnimationFrame(tick);
    })();
    const alive = () => !done;
    (async()=>{ while(alive()){ await (r.key==='find' ? qFind(r,alive) : qWho(r,alive,r.key==='zoom')); } })();
  });
}

function options(target,n){
  return shuffle([target, ...shuffle(PEOPLE.filter(p=>p!==target && p.g===target.g)).slice(0,n-1)]);
}

function qWho(r,alive,zoomOut){
  return new Promise(resolve=>{
    const t = draw(), opts = options(t,4), play=$('#play');
    if(!play){resolve();return}
    play.innerHTML = `<p class="prompt">${zoomOut?'Zooming out… worth <b id="worth">300</b>':'Whose eyes are these?'}</p>
      <div class="ghostbox" id="gb"><div class="float" style="position:absolute;inset:0">${ghostSVG(t,false,zoomOut?ZSTART:ZOOM)}</div><div class="reveal"><img src="${t.f}" alt=""></div></div>
      <div class="answers">${opts.map((o,k)=>`<button class="ans" data-k="${k}">${esc(o.n)}</button>`).join('')}</div>`;
    const gb=$('#gb');
    const t0=performance.now(); let worth=r.pts, answered=false;
    if(zoomOut){
      const imgs=[...gb.querySelectorAll('.eyeimg')], w=$('#worth');
      (function z(){
        if(answered||!alive()) return;
        const el=performance.now()-t0, k=Math.min(1,el/ZDUR), ease=1-Math.pow(1-k,2), zz=ZSTART+(ZOOM-ZSTART)*ease;
        if(k<1 || !imgs.done){ imgs.forEach(im=>im.setAttribute('transform',`${im.dataset.pre} scale(${im.dataset.s*zz}) ${im.dataset.post}`)); if(k>=1) imgs.done=true; }
        worth=Math.max(0,Math.round(r.pts*(1-el/PDUR)/10)*10); if(w) w.textContent=worth;
        if(worth>0) requestAnimationFrame(z);
      })();
    }
    play.querySelectorAll('.ans').forEach(b=>b.onclick=async()=>{
      if(!alive()) return;
      answered=true;
      const pick=opts[+b.dataset.k], ok=pick===t;
      play.querySelectorAll('.ans').forEach(x=>{x.disabled=true; if(opts[+x.dataset.k]===t) x.classList.add('right')});
      if(!ok) b.classList.add('wrong');
      gb.classList.add('show-reveal');
      ok ? scoreHit(zoomOut?worth:r.pts) : scoreMiss();
      await sleep(ok?650:1200);
      resolve();
    });
  });
}

function qFind(r,alive){
  return new Promise(resolve=>{
    const t = draw(), opts = options(t,6), play=$('#play');
    if(!play){resolve();return}
    play.innerHTML = `<p class="prompt">Find <b>${esc(t.n)}</b></p>
      <div class="grid6">${opts.map((o,k)=>`<button class="tile" data-k="${k}" aria-label="Ghost ${k+1}">${ghostSVG(o,true)}<span class="who">${esc(firstName(o.n))}</span></button>`).join('')}</div>`;
    play.querySelectorAll('.tile').forEach(b=>b.onclick=async()=>{
      if(!alive()) return;
      const pick=opts[+b.dataset.k], ok=pick===t;
      play.querySelectorAll('.tile').forEach(x=>{x.disabled=true; x.classList.add('named'); if(opts[+x.dataset.k]===t) x.classList.add('right')});
      if(!ok) b.classList.add('wrong');
      ok ? scoreHit(r.pts) : scoreMiss();
      await sleep(ok?650:1300);
      resolve();
    });
  });
}

async function finish(){
  const acc = G.answered ? Math.round(100*G.correct/G.answered) : 0;
  stage.innerHTML = `<div class="screen">
    <div class="ghostbox float" style="width:min(200px,55%)">${ghostSVG(PEOPLE[Math.random()*PEOPLE.length|0])}</div>
    <h2 style="font-size:42px">${G.score>=3000?'Ghostbuster!':G.score>=1500?'Spooky good!':'Nice haunting!'}</h2>
    <div class="stats"><div><b>${G.score}</b><small>points</small></div><div><b>${G.correct}/${G.answered}</b><small>ghosts unmasked</small></div><div><b>${acc}%</b><small>accuracy</small></div><div><b>${G.best}</b><small>best streak</small></div></div>
    <button class="big" id="again">Play again</button>
  </div>`;
  $('#again').onclick = home;
}

home();
</script>

</body>
</html>
